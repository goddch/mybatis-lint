name: Package extension

# Java ランタイムを同梱したプラットフォーム別の VSIX を作る。
# jlink は実行した OS 向けのランタイムしか作れないため、対象ごとにその OS のランナーで実行する。
# v* タグを push したときだけ、作った VSIX を GitHub Release に添付し(release ジョブ)、
# そのあと Marketplace への公開を試す(publish ジョブ)。
# 公開は vsce の OIDC trusted publishing を使う。トークンの方式は Azure サブスクリプションが
# 必要で、しかも 2026-12-01 で廃止されるため使わない。Marketplace の管理画面の Trusted Publishing に、
# このワークフロー(package.yml、environment なし)を登録してある。ファイル名を変えるとポリシーと
# 合わなくなるので注意。publish ジョブが失敗したときは、Release の VSIX を管理画面から手動でアップロードする。
#
# macOS arm64 のランナーは容量不足で、割り当てまで 1 時間近くかかったり、割り当てられないまま打ち切られたりする。
# 待っている間ほかのプラットフォームも公開できなくなるので、darwin-arm64 だけ別のジョブに分け、先に 3 つを公開してから
# 同じバージョンに追加で公開する。打ち切られたときは、失敗したジョブだけ再実行すればよい。

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # パッケージ作成まわりを変えた PR では、全プラットフォームで VSIX が作れることを確認する。
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/package.yml'
      - '.github/actions/package-vsix/**'

permissions:
  contents: read

jobs:
  analyzer-jar:
    name: Build analyzer jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test jar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-jar
          path: analyzer/build/libs/analyzer.jar

  package:
    name: Package ${{ matrix.target }}
    needs: analyzer-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-vsix
        with:
          target: ${{ matrix.target }}
          artifact-name: vsix-${{ matrix.target }}

  package-darwin-arm64:
    name: Package darwin-arm64
    needs: analyzer-jar
    # PR で順番待ちになると確認がいつまでも終わらないので、タグと手動実行のときだけ作る。
    # macOS での作り方の確認は、PR でも動く darwin-x64 で足りる。
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/package-vsix
        with:
          target: darwin-arm64
          # 名前を vsix-* にしない。release と publish が先に拾うと、あとで二重に公開して失敗する。
          artifact-name: late-vsix-darwin-arm64

  release:
    name: Create GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches package.json version
        run: |
          expected="v$(node -p "require('./vscode-extension/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - name: Create release with VSIX files
        run: gh release create "$GITHUB_REF_NAME" vsix/*.vsix --prerelease --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish to Marketplace
    # Release を先に作っておけば、公開に失敗しても手動アップロード用の VSIX は残る。
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GitHub Actions の OIDC トークンを Marketplace のトークンと交換するのに要る。
      id-token: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - name: Publish all platform VSIX files
        run: npx vsce publish --oidc --packagePath ../vsix/*.vsix

  publish-darwin-arm64:
    name: Publish darwin-arm64
    needs: [package-darwin-arm64, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: late-vsix-darwin-arm64
          path: vsix
      - name: Add the VSIX to the release
        run: gh release upload "$GITHUB_REF_NAME" ../vsix/*.vsix
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to Marketplace
        run: npx vsce publish --oidc --packagePath ../vsix/*.vsix
