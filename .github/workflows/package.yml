name: Package extension

# Java ランタイムを同梱したプラットフォーム別の VSIX を作る。
# jlink は実行した OS 向けのランタイムしか作れないため、対象ごとにその OS のランナーで実行する。
# v* タグを push したときだけ、作った VSIX を Marketplace に公開する(publish ジョブ)。

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # パッケージ作成まわりを変えた PR では、全プラットフォームで VSIX が作れることを確認する。
  pull_request:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  analyzer-jar:
    name: Build analyzer jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: ./gradlew test jar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: analyzer-jar
          path: analyzer/build/libs/analyzer.jar

  package:
    name: Package ${{ matrix.target }}
    needs: analyzer-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: analyzer-jar
          path: analyzer/build/libs
      - run: npm ci
      - run: npm run compile
      - run: npm run bundle
      - run: npx vsce package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: vscode-extension/*.vsix

  publish:
    name: Publish to Marketplace
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # marketplace 環境には Required reviewers を設定している。誤ってタグが付いても、
    # 承認するまでは公開されない。VSCE_PAT もこの環境のシークレットとして登録する。
    environment: marketplace
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - name: Check that the tag matches package.json version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)." >&2
            exit 1
          fi
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          merge-multiple: true
          path: vsix
      - name: Publish
        run: npx vsce publish --packagePath ../vsix/*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
